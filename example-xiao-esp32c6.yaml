# Thermia Duo / controller 901510, Seeed Studio XIAO ESP32-C6, ISO1540.
# Wiring and first flash: docs/hardware/xiao-esp32c6-iso1540.sv.md
# Start with this EXT-only configuration. The PhotoMOS version is a separate file.
substitutions:
  thermia_component_source: github://mtornblad/esphome-thermia@main

esphome:
  name: thermia-duo-c6
  friendly_name: Thermia Duo
  min_version: 2026.10.2
  on_boot:
    priority: 600
    then:
      - output.turn_off: antenna_enable
      - output.turn_off: antenna_select

esp32:
  variant: esp32c6
  flash_size: 4MB
  cpu_frequency: 160MHz
  framework:
    type: esp-idf

external_components:
  - source: ${thermia_component_source}
    components: [thermia]

logger:
  hardware_uart: USB_SERIAL_JTAG
  level: DEBUG
  logs:
    sensor: INFO

api:
  encryption:
    key: !secret api_encryption_key
  # Losing Home Assistant should not repeatedly reboot the controller.
  reboot_timeout: 0s

ota:
  - platform: esphome
    # Reuse api.encryption.key for authenticated, encrypted OTA uploads.
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  reboot_timeout: 0s
  ap:
    ssid: Thermia Duo C6 Setup
    password: !secret fallback_password

captive_portal:

# Use the onboard antenna. GPIO3 enables its RF switch; GPIO14 LOW selects it.
# Set antenna_select HIGH only if an external antenna is actually connected.
output:
  - platform: gpio
    id: antenna_enable
    pin: GPIO3
  - platform: gpio
    id: antenna_select
    pin: GPIO14

# No `i2c:` block: the pump is the I2C master; thermia emulates slave 0x2E.
# ISO1540 side 2 -> XIAO: VCC -> 3V3, GND -> GND, SDA -> D4, SCL -> D5.
# ISO1540 side 1 -> pump EXT: VCC -> pump +5V, GND -> pump GND, SDA/SCL -> EXT.
thermia:
  id: heatpump
  sda_pin: GPIO22  # XIAO D4, NOT GPIO4
  scl_pin: GPIO23  # XIAO D5, NOT GPIO5
  update_interval: 10s
  stale_timeout: 120s
  request_tries: 50
  debug_frames: false
  sniff: false
  selftest: false

  link:
    name: EXT link
  temp_outdoor:
    name: Utetemperatur
  temp_indoor:
    name: Rumstemperatur enligt pumpen
  temp_indoor_target:
    name: Rumsborvarde enligt pumpen
  temp_supply:
    name: Framledning
  temp_return:
    name: Returledning
  temp_hotwater:
    name: Varmvatten
  temp_brine_in:
    name: Koldbarare in
  temp_brine_out:
    name: Koldbarare ut
  temp_supply_target:
    name: Framledning borvarde
  temp_hot_gas:
    name: Hetgas
  integral:
    name: Integral
  sw_version:
    name: Pumpens mjukvaruversion
  runtime_compressor:
    name: Drifttid kompressor
  runtime_hotwater:
    name: Drifttid varmvatten
  runtime_aux_3kw:
    name: Drifttid tillsats 3 kW
  runtime_aux_6kw:
    name: Drifttid tillsats 6 kW

  compressor:
    name: Kompressor
  brine_pump:
    name: Koldbararpump
  supply_pump:
    name: Cirkulationspump
  hotwater_production:
    name: Varmvattenproduktion
  aux_3kw:
    name: Tillsats 3 kW
  aux_6kw:
    name: Tillsats 6 kW
  alarm:
    name: Larm
  alarm_high_pressure:
    name: Larm hogtryck
  alarm_low_pressure:
    name: Larm lagtryck
  alarm_motor_breaker:
    name: Larm motorskydd
  alarm_indoor_sensor:
    name: Larm rumsgivare
  alarm_outdoor_sensor:
    name: Larm utegivare

  # These settings only write after an explicit command, never automatically at boot.
  # Compare the reported values with the pump display before changing anything.
  setting_indoor_temp:
    name: Rumsvarde utan rumsgivare
    min_value: 16
    max_value: 26
    step: 1
  setting_curve_slope:
    name: Varmekurva
    min_value: 22
    max_value: 56
    step: 1
  # Mode changes (including Off) are deliberately not exposed in the first-test config.
  # setting_main_mode:
  #   name: Driftlage

sensor:
  - platform: wifi_signal
    id: wifi_signal_db
    name: WiFi signal
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: Upptid
    update_interval: 60s

button:
  - platform: restart
    name: Starta om
    entity_category: diagnostic
