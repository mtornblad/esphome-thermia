# Copy to secrets.yaml and fill in. secrets.yaml is git-ignored.
wifi_ssid: "your-wifi"
wifi_password: "your-wifi-password"
api_encryption_key: "generate-with: openssl rand -base64 32"
# Only needed temporarily when migrating older password-only OTA firmware.
# Current C6 examples reuse api_encryption_key for OTA; no extra key is needed.
ota_password: "change-me"
fallback_password: "change-me-too"
# Only needed by example-xiao-esp32c6-thread.yaml. Copy your existing network's
# Active dataset TLVs as one quoted hex string. Never publish the real value.
thread_dataset_tlv: "replace-with-your-active-dataset-tlvs"
