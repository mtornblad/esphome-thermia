name: CI

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run slave engine tests
        run: |
          g++ -std=c++17 -Wall -DTHERMIA_HOST_TEST -I test -I components/thermia test/test_slave.cpp components/thermia/thermia_slave.cpp -o test/test_slave
          ./test/test_slave

  esphome-compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: esp8266
            config: example.yaml
            sed: ""
          - target: esp32
            config: example-esp32.yaml
            sed: ""
          - target: esp32-c3
            config: example-esp32.yaml
            sed: "s#board: esp32dev#board: esp32-c3-devkitm-1#; s#GPIO21#GPIO6#; s#GPIO22#GPIO7#"
          - target: xiao-esp32c6
            config: example-xiao-esp32c6.yaml
            sed: ""
          - target: xiao-esp32c6-photomos
            config: example-xiao-esp32c6-photomos.yaml
            sed: ""
          - target: xiao-esp32c6-thread
            config: example-xiao-esp32c6-thread.yaml
            sed: ""
    name: esphome-compile (${{ matrix.target }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ESPHome
        run: pip install esphome
      - name: Prepare CI config (local component, dummy secrets)
        run: |
          sed 's#source: github://mdepa91/esphome-thermia#source: {type: local, path: components}#' ${{ matrix.config }} > ci.yaml
          if [ -n "${{ matrix.sed }}" ]; then sed -i "${{ matrix.sed }}" ci.yaml; fi
          cp secrets.example.yaml secrets.yaml
          # Synthetic dataset for compilation only; never use production Thread credentials in CI.
          sed -i 's#^thread_dataset_tlv:.*#thread_dataset_tlv: "0e080000000000010000000300000f35060004001fffe0020800112233445566770708fd112233445566770510000102030405060708090a0b0c0d0e0f030a546865726d69612d43490102abcd0410101112131415161718191a1b1c1d1e1f0c0402a0f7f8"#' secrets.yaml
          sed -i "s#^api_encryption_key:.*#api_encryption_key: \"$(openssl rand -base64 32)\"#" secrets.yaml
      - name: Validate
        run: esphome -s thermia_component_source components config ci.yaml
      - name: Compile
        run: esphome -s thermia_component_source components compile ci.yaml
